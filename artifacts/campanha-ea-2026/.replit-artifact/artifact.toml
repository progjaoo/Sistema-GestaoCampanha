kind = "web"
previewPath = "/"
title = "Gestão da Campanha EA 2026"
description = "Painel mobile-first para acompanhar a cobertura territorial, lideranças, pendências de revisão e consolidação dos dados da campanha a partir da base importada."
version = "1.0.0"
id = "artifacts/campanha-ea-2026"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20777

[services.development]
run = "pnpm --filter @workspace/campanha-ea-2026 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campanha-ea-2026", "run", "build" ]
serve = "static"
publicDir = "artifacts/campanha-ea-2026/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20777"
BASE_PATH = "/"

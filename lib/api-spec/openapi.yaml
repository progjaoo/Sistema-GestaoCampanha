openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Email and password authentication
  - name: access-control
    description: Users, roles and permissions
  - name: campaign
    description: Campaign overview and coverage
  - name: leaderships
    description: Leadership records
  - name: review
    description: Import and data quality review
  - name: materials
    description: Material catalog and city withdrawals
security:
  - BearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogin"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current client session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
  /auth/rbac/roles:
    get:
      operationId: listRolesAndPermissions
      tags: [access-control]
      summary: List the RBAC permission matrix
      responses:
        "200":
          description: Roles and permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRbac"
  /auth/rbac/roles/{role}:
    patch:
      operationId: updateRolePermissions
      tags: [access-control]
      summary: Update the permissions assigned to a role
      parameters:
        - $ref: "#/components/parameters/AuthRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRolePermissionsInput"
      responses:
        "200":
          description: Updated role
  /auth/users:
    get:
      operationId: listAuthUsers
      tags: [access-control]
      summary: List system users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUserAdmin"
    post:
      operationId: createAuthUser
      tags: [access-control]
      summary: Create a system user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthUserInput"
      responses:
        "201":
          description: User created
  /auth/users/{id}:
    patch:
      operationId: updateAuthUser
      tags: [access-control]
      summary: Update a system user
      parameters:
        - $ref: "#/components/parameters/AuthUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthUserUpdate"
      responses:
        "200":
          description: User updated
    delete:
      operationId: deleteAuthUser
      tags: [access-control]
      summary: Delete a system user
      parameters:
        - $ref: "#/components/parameters/AuthUserId"
      responses:
        "200":
          description: User deleted
  /campaign/overview:
    get:
      operationId: getCampaignOverview
      tags: [campaign]
      summary: Get the campaign macro overview
      responses:
        "200":
          description: Dynamic campaign aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignOverview"
  /regions:
    get:
      operationId: listRegions
      tags: [campaign]
      summary: List regions with dynamic leadership totals
      responses:
        "200":
          description: Region list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"
  /cities:
    get:
      operationId: listCities
      tags: [campaign]
      summary: List cities, optionally filtered by region
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/FederalDeputyId"
      responses:
        "200":
          description: City list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
  /leaderships:
    get:
      operationId: listLeaderships
      tags: [leaderships]
      summary: Search and paginate leadership records
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/CityId"
        - $ref: "#/components/parameters/FederalDeputyId"
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: reviewOnly
          schema:
            type: boolean
            default: false
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [name, city, region, deputy, status]
            default: name
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated leadership list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipList"
    post:
      operationId: createLeadership
      tags: [leaderships]
      summary: Create a leadership record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadershipInput"
      responses:
        "201":
          description: Created leadership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leadership"
        "400":
          description: Invalid leadership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /deputies:
    get:
      operationId: listFederalDeputies
      tags: [campaign]
      summary: List federal deputies with dynamic support totals
      responses:
        "200":
          description: Federal deputy support list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FederalDeputy"
  /leaderships/{id}:
    get:
      operationId: getLeadership
      tags: [leaderships]
      summary: Get a leadership record
      parameters:
        - $ref: "#/components/parameters/LeadershipId"
      responses:
        "200":
          description: Leadership detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leadership"
        "404":
          description: Leadership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateLeadership
      tags: [leaderships]
      summary: Update a leadership record
      parameters:
        - $ref: "#/components/parameters/LeadershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadershipUpdate"
      responses:
        "200":
          description: Updated leadership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leadership"
        "404":
          description: Leadership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /review/issues:
    get:
      operationId: listReviewIssues
      tags: [review]
      summary: List records that need reconciliation
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, resolved, all]
            default: open
      responses:
        "200":
          description: Review issue list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewIssue"
  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List active materials in the catalog
      responses:
        "200":
          description: Material catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
    post:
      operationId: createMaterial
      tags: [materials]
      summary: Add a material to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Material created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
  /materials/{id}:
    patch:
      operationId: updateMaterial
      tags: [materials]
      summary: Update or deactivate a catalog material
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: Updated material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
    delete:
      operationId: deleteMaterial
      tags: [materials]
      summary: Deactivate a catalog material
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "204":
          description: Material deactivated
  /material-withdrawals:
    get:
      operationId: listMaterialWithdrawals
      tags: [materials]
      summary: List material withdrawals in the authorized territory
      responses:
        "200":
          description: Withdrawal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialWithdrawal"
    post:
      operationId: createMaterialWithdrawal
      tags: [materials]
      summary: Create a city material withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialWithdrawalInput"
      responses:
        "201":
          description: Withdrawal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialWithdrawal"
  /material-withdrawals/{id}:
    get:
      operationId: getMaterialWithdrawal
      tags: [materials]
      summary: Get a material withdrawal and its items
      parameters:
        - $ref: "#/components/parameters/MaterialWithdrawalId"
      responses:
        "200":
          description: Withdrawal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialWithdrawal"
    patch:
      operationId: updateMaterialWithdrawal
      tags: [materials]
      summary: Edit a withdrawal or change its status
      parameters:
        - $ref: "#/components/parameters/MaterialWithdrawalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialWithdrawalUpdate"
      responses:
        "200":
          description: Updated withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialWithdrawal"
    delete:
      operationId: deleteMaterialWithdrawal
      tags: [materials]
      summary: Delete a material withdrawal
      parameters:
        - $ref: "#/components/parameters/MaterialWithdrawalId"
      responses:
        "204":
          description: Withdrawal deleted
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RegionId:
      in: query
      name: regionId
      schema:
        type: integer
        minimum: 1
    CityId:
      in: query
      name: cityId
      schema:
        type: integer
        minimum: 1
    FederalDeputyId:
      in: query
      name: federalDeputyId
      schema:
        type: integer
        minimum: 1
    LeadershipId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    AuthRole:
      in: path
      name: role
      required: true
      schema:
        type: string
        enum: [ADMIN_GERAL, ARTICULADOR, COORDENADOR, LIDERANCA]
    AuthUserId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    MaterialId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    MaterialWithdrawalId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Material:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        unit: { type: string }
        isActive: { type: boolean }
      required: [id, name, description, unit, isActive]
    MaterialInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        unit: { type: string }
        isActive: { type: boolean }
      required: [name]
    MaterialUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        unit: { type: string }
        isActive: { type: boolean }
    MaterialWithdrawalItem:
      type: object
      properties:
        id: { type: integer }
        materialId: { type: integer }
        materialName: { type: string }
        unit: { type: string }
        quantity: { type: ["integer", "null"] }
      required: [id, materialId, materialName, unit, quantity]
    MaterialWithdrawal:
      type: object
      properties:
        id: { type: integer }
        cityId: { type: integer }
        cityName: { type: string }
        regionName: { type: string }
        responsibleUserId: { type: integer }
        responsibleName: { type: string }
        status:
          type: string
          enum: [requested, separated, delivered, cancelled]
        postalCode: { type: string }
        street: { type: string }
        number: { type: string }
        complement: { type: ["string", "null"] }
        neighborhood: { type: string }
        addressCity: { type: string }
        state: { type: string }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/MaterialWithdrawalItem"
      required: [id, cityId, cityName, regionName, responsibleUserId, responsibleName, status, postalCode, street, number, complement, neighborhood, addressCity, state, notes, createdAt, updatedAt]
    MaterialWithdrawalInput:
      type: object
      properties:
        cityId: { type: integer, minimum: 1 }
        responsibleUserId: { type: integer, minimum: 1 }
        postalCode: { type: string, minLength: 1 }
        street: { type: string, minLength: 1 }
        number: { type: string, minLength: 1 }
        complement: { type: ["string", "null"] }
        neighborhood: { type: string, minLength: 1 }
        addressCity: { type: string, minLength: 1 }
        state: { type: string, minLength: 2, maxLength: 2 }
        notes: { type: ["string", "null"] }
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              materialId: { type: integer, minimum: 1 }
              quantity: { type: ["integer", "null"], minimum: 1 }
            required: [materialId]
      required: [cityId, responsibleUserId, postalCode, street, number, neighborhood, addressCity, state, items]
    MaterialWithdrawalUpdate:
      allOf:
        - $ref: "#/components/schemas/MaterialWithdrawalInput"
      properties:
        status:
          type: string
          enum: [requested, separated, delivered, cancelled]
    AuthLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        rememberMe:
          type: boolean
          default: false
      required: [email, password]
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
        regionId:
          type: ["integer", "null"]
        cityId:
          type: ["integer", "null"]
        leadershipId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        canCreateLeaderUsers:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required: [id, email, fullName, role, regionId, cityId, leadershipId, isActive, canCreateLeaderUsers, permissions]
    AuthSession:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]
    AuthPermission:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        label:
          type: string
        description:
          type: string
        category:
          type: string
      required: [id, key, label, description, category]
    AuthRole:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
        userCount:
          type: integer
        permissionKeys:
          type: array
          items:
            type: string
      required: [key, label, description, userCount, permissionKeys]
    AuthRbac:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AuthRole"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/AuthPermission"
      required: [roles, permissions]
    AuthRolePermissionsInput:
      type: object
      properties:
        permissionKeys:
          type: array
          items:
            type: string
      required: [permissionKeys]
    AuthUserInput:
      allOf:
        - $ref: "#/components/schemas/AuthUserUpdate"
        - type: object
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
          required: [email, password, fullName, role]
    AuthUserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
        regionId:
          type: ["integer", "null"]
        cityId:
          type: ["integer", "null"]
        leadershipId:
          type: ["integer", "null"]
        isActive:
          type: boolean
        canCreateLeaderUsers:
          type: boolean
        password:
          type: string
          minLength: 8
        phone:
          type: ["string", "null"]
      required: [fullName, role]
    AuthUserAdmin:
      allOf:
        - $ref: "#/components/schemas/AuthUser"
        - type: object
          properties:
            regionName:
              type: ["string", "null"]
            cityName:
              type: ["string", "null"]
            lastLoginAt:
              type: ["string", "null"]
              format: date-time
            createdAt:
              type: string
              format: date-time
    Region:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cityCount:
          type: integer
        leadershipCount:
          type: integer
      required: [id, name, cityCount, leadershipCount]
    City:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        regionId:
          type: integer
        regionName:
          type: string
        leadershipCount:
          type: integer
        deputyCount:
          type: integer
      required: [id, name, regionId, regionName, leadershipCount, deputyCount]
    FederalDeputy:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        isAlliance:
          type: boolean
        leadershipCount:
          type: integer
        cityCount:
          type: integer
      required: [id, name, isAlliance, leadershipCount, cityCount]
    Leadership:
      type: object
      properties:
        id:
          type: integer
        cityId:
          type: integer
        cityName:
          type: string
        regionId:
          type: integer
        regionName:
          type: string
        internalRegion:
          type: ["string", "null"]
        articulatorId:
          type: ["integer", "null"]
        articulatorName:
          type: ["string", "null"]
        coordinatorId:
          type: ["integer", "null"]
        coordinatorName:
          type: ["string", "null"]
        coordinatorContact:
          type: ["string", "null"]
        name:
          type: string
        leadershipContact:
          type: ["string", "null"]
        federalDeputyId:
          type: ["integer", "null"]
        federalDeputyName:
          type: ["string", "null"]
        allianceStatus:
          type: ["string", "null"]
        originalFederalDeputy:
          type: ["string", "null"]
        religion:
          type: ["string", "null"]
        sourceSheet:
          type: string
        sourceRow:
          type: integer
        needsReview:
          type: boolean
      required:
        - id
        - cityId
        - cityName
        - regionId
        - regionName
        - name
        - sourceSheet
        - sourceRow
        - needsReview
    LeadershipInput:
      type: object
      properties:
        cityId:
          type: integer
        internalRegion:
          type: ["string", "null"]
        articulatorId:
          type: ["integer", "null"]
        coordinatorId:
          type: ["integer", "null"]
        coordinatorContact:
          type: ["string", "null"]
        name:
          type: string
          minLength: 1
        leadershipContact:
          type: ["string", "null"]
        federalDeputyId:
          type: ["integer", "null"]
        allianceStatus:
          type: ["string", "null"]
        originalFederalDeputy:
          type: ["string", "null"]
        religion:
          type: ["string", "null"]
      required: [cityId, name]
    LeadershipUpdate:
      type: object
      properties:
        cityId:
          type: integer
        internalRegion:
          type: ["string", "null"]
        articulatorId:
          type: ["integer", "null"]
        coordinatorId:
          type: ["integer", "null"]
        coordinatorContact:
          type: ["string", "null"]
        name:
          type: string
          minLength: 1
        leadershipContact:
          type: ["string", "null"]
        federalDeputyId:
          type: ["integer", "null"]
        allianceStatus:
          type: ["string", "null"]
        originalFederalDeputy:
          type: ["string", "null"]
        religion:
          type: ["string", "null"]
        needsReview:
          type: boolean
    LeadershipList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Leadership"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [items, total, page, pageSize]
    CampaignOverview:
      type: object
      properties:
        totals:
          type: object
          properties:
            regions:
              type: integer
            cities:
              type: integer
            leaderships:
              type: integer
            reviewItems:
              type: integer
          required: [regions, cities, leaderships, reviewItems]
        regions:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        topDeputies:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              leadershipCount:
                type: integer
            required: [name, leadershipCount]
      required: [totals, regions, topDeputies]
    ReviewIssue:
      type: object
      properties:
        id:
          type: integer
        leadershipId:
          type: integer
        type:
          type: string
        severity:
          type: string
          enum: [high, medium, low]
        details:
          type: string
        status:
          type: string
          enum: [open, resolved]
        sourceSheet:
          type: string
        sourceRow:
          type: integer
      required: [id, leadershipId, type, severity, details, status, sourceSheet, sourceRow]

